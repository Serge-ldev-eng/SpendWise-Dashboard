
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
  <aside class="sidebar">
    <h2>SpendWise</h2>
    <nav>
      <a href="#">Dashboard</a>
      <a href="#">Transactions</a>
      <a href="#">Analytics</a>
      <a href="#">Budgets</a>
      <a href="#">Settings</a>
    </nav>
  </aside>
  <div>
    <header class="header">
      <h1>Dashboard</h1>
      <button>Add Expense</button>
    </header>
    <main class="cards-grid">
      <div class="card" tabindex="0">
        <span class="card-title">Food</span>
        <span class="card-amount">$420.50</span>
        <span>12 transactions</span>
      </div>
      <div class="card" tabindex="0">
        <span class="card-title">Transport</span>
        <span class="card-amount">$180.00</span>
        <span>8 transactions</span>
      </div>
      <div class="card" tabindex="0">
        <span class="card-title">Rent</span>
        <span class="card-amount">$1,200.00</span>
        <span>1 transaction</span>
      </div>
      <div class="card" tabindex="0">
        <span class="card-title">Entertainment</span>
        <span class="card-amount">$95.30</span>
        <span>5 transactions</span>
      </div>
      <div class="card" tabindex="0">
        <span class="card-title">Savings</span>
        <span class="card-amount">$800.00</span>
        <span>3 transactions</span>
      </div>
      <div class="card" tabindex="0">
        <span class="card-title">Utilities</span>
        <span class="card-amount">$150.75</span>
        <span>4 transactions</span>
      </div>
    </main>
  </div>
</div>
</body>
</html>
